*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;padding-bottom:120px}
.bgros{position:absolute;inset-inline-start:-60px;top:-40px;width:220px;height:220px;background:var(--oud);opacity:.05;-webkit-mask:var(--ros) center/contain no-repeat;mask:var(--ros) center/contain no-repeat;animation:spin 90s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 6px}
.logo{width:104px;height:50px;background:var(--oud);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.steps{display:flex;gap:6px}
.steps i{width:24px;height:5px;border-radius:3px;background:var(--line);transition:background .4s,width .4s}
.steps i.on{background:var(--oud);width:34px}
.screen{padding:0 18px;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.screen.back{animation-name:inb}
@keyframes inb{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
h1{font-size:30px;font-weight:800;color:var(--oud);margin:8px 0 2px;line-height:1.25}
.sub{color:var(--mute);margin:0 0 14px}
.backb{background:none;border:0;color:var(--mute);padding:6px 0;font-size:14px;display:inline-flex;gap:6px;align-items:center}

/* returning */
.again{display:flex;gap:12px;align-items:center;background:var(--oud);color:var(--cream);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;border:0;width:100%;text-align:right;position:relative;overflow:hidden}
.again::after{content:"";position:absolute;inset-inline-end:-20px;top:-20px;width:90px;height:90px;background:var(--gold);opacity:.18;-webkit-mask:var(--ros) center/contain no-repeat;mask:var(--ros) center/contain no-repeat}
.again b{display:block;font-size:15px}.again small{opacity:.8;font-size:13px}
.again .arr{margin-inline-start:auto;background:var(--cream);color:var(--oud);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}

/* search & chips */

/* bottom bar */
.bar{position:fixed;bottom:0;left:50%;transform:translate(-50%,130%);width:min(480px,100%);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));transition:transform .45s cubic-bezier(.2,1.2,.3,1);z-index:20}

.opt b{display:block;font-size:15px}.opt small{color:var(--mute);font-size:12px}

.primary[disabled]{opacity:.45}

/* time */
.picked{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}

.soon{position:relative;overflow:hidden;border-radius:24px;background:var(--oud);color:var(--cream);padding:16px;display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:right}

.fld label{font-size:13px;color:var(--mute)}
.fld input{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .2s}

const sar=n=>A(n.toLocaleString('en'))+' ر.س';
const dur=m=>{if(!m)return '';const h=Math.floor(m/60),r=m%60;let s=h===0?'':h===1?'ساعة':h===2?'ساعتين':A(h)+' ساعات';if(r)s+=(s?' و':'')+(r===30&&h?'نص':A(r)+' دقيقة');return s};
const LEN={S:['قصير',18],M:['متوسط',24],L:['طويل',30],VL:['طويل جدًا',36],'2VL':['طويل جدًا ×٢',40]};
function lenOf(n){const m=n.match(/(2VL|VL|L|M|S)\s*$/);if(m)return LEN[m[1]];if(/×٢/.test(n))return LEN['2VL'];if(/جدًا/.test(n))return LEN.VL;if(/طويل/.test(n))return LEN.L;if(/متوسط/.test(n))return LEN.M;if(/قصير/.test(n))return LEN.S;return null}
const POP=['astshwar-shar-beautfresh-signature','manykyr','altrmym','manykyr-1','jyl-bwlysh','brwtyn-1-1-1'];
const STAFF=[['أي مختصة',''],['ريم','ر'],['نوف','ن'],['دانة','د'],['لمى','ل']];
const Q=new URLSearchParams(location.search);
const S={step:0,g:-1,q:'',sel:[],staff:0,day:0,slot:null,name:'',phone:'',dir:0};
const byId=id=>DATA.svcs.find(s=>s.id===id);
const $=s=>document.querySelector(s);
const main=$('#main');

function total(){return S.sel.reduce((a,x)=>a+x.p,0)}
function mins(){return S.sel.reduce((a,x)=>a+(x.d||45),0)}
function isSel(id){return S.sel.some(x=>x.id===id)}
function toggle(s,v){
  const i=S.sel.findIndex(x=>x.id===s.id);
  if(i>-1&&!v){S.sel.splice(i,1)}else{if(i>-1)S.sel.splice(i,1);S.sel.push({id:s.id,n:v?(lenOf(v.n)?s.n+' · '+lenOf(v.n)[0]:(v.n.includes(s.n)?v.n:s.n+' · '+v.n)):s.n,p:v?v.p:s.p,d:v?v.d:s.d})}
  bar(true);
}
function bar(b){
  const el=$('#bar');
  if(S.step>=3||!S.sel.length){el.classList.remove('show');return}
  el.classList.add('show');
  $('#barT').textContent=sar(total());
  $('#barS').textContent=A(S.sel.length)+(S.sel.length===1?' خدمة':' خدمات')+' · '+dur(mins());
  const go=$('#barGo');
  if(S.step===0){go.innerHTML='اختاري الوقت <span>←</span>';go.disabled=false}
  else if(S.step===1){go.innerHTML='التالي <span>←</span>';go.disabled=!S.slot}
  else {go.innerHTML='أكّدي الحجز';go.disabled=!(S.name.trim()&&S.phone.replace(/\D/g,'').length>=9)}
  if(b){el.querySelector('.in').classList.remove('bump');void el.offsetWidth;el.querySelector('.in').classList.add('bump')}
}
function steps(){document.querySelectorAll('#steps i').forEach((i,k)=>i.classList.toggle('on',k<=Math.min(S.step,2)));$('#steps').style.visibility=S.step>=3?'hidden':'visible'}
function go(n){S.dir=n<S.step?1:0;S.step=n;render();window.scrollTo({top:0,behavior:'smooth'})}

/* step 0 */
function svcRow(s){
  const sel=isSel(s.id);const v=s.v&&s.v.length;const byLen=v&&s.v.some(x=>lenOf(x.n));
  return '<button class="svc'+(sel?' sel':'')+'" data-s="'+s.id+'"><span><b>'+s.n+(v?'<span class="vtag">'+(byLen?'حسب الطول':A(s.v.length)+' خيارات')+'</span>':'')+'</b><small>'+[dur(s.d),s.x?s.x.split(/[،,.]/)[0]:''].filter(Boolean).join(' · ')+'</small></span><span class="pr num">'+((v||s.from)?'<em>من</em>':'')+sar(s.p)+'</span><span class="tick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F3EBDF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span></button>';
}
function list(){
  const q=S.q.trim();
  const cats=S.g<0?ORDER:GROUPS[S.g].c;
  let h='';
  for(const ci of cats){
    const items=DATA.svcs.filter(s=>s.c===ci&&(!q||s.n.includes(q)||(s.x||'').includes(q)));
    if(!items.length)continue;
    h+='<div class="cat"><div class="cath"><span class="ci"><i style="--ic:'+icu(CAT_IC[ci])+'"></i></span><h3>'+DATA.cats[ci].replace(' و ',' و')+'</h3><small>'+A(items.length)+'</small></div>'+items.map(svcRow).join('')+'</div>';
  }
  return h||'<p class="empty">ما لقينا «'+q+'». جرّبي كلمة ثانية.</p>';
}
function s0(){
  const back=Q.has('back');
  return '<div class="screen'+(S.dir?' back':'')+'">'+
  (back?'<button class="again" id="again"><span><b>أهلًا نورة، نرجع لنفس الطلّة؟</b><small>آخر زيارة: استشوار Signature · طويل</small></span><span class="arr">احجزيها ←</span></button>':'')+
  '<h1>احجزي موعدك</h1><p class="sub">اختاري الخدمة والوقت، وخلاص. بدون حساب وبدون رمز.</p>'+
  '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="ابحثي: استشوار، جيل، رموش…" value="'+S.q+'" autocomplete="off"></label>'+
  '<div class="chips"><button class="chip'+(S.g<0?' on':'')+'" data-g="-1">الكل</button>'+GROUPS.map((g,i)=>'<button class="chip'+(S.g===i?' on':'')+'" data-g="'+i+'">'+g.n+'</button>').join('')+'</div>'+
  (S.g<0&&!S.q?'<div class="lbl">الأكثر طلبًا</div><div class="pop">'+POP.map((id,k)=>{const s=byId(id);return '<button class="pc'+(isSel(id)?' sel':'')+'" data-s="'+id+'"><div class="art g'+(k%3)+'"><i style="--ic:'+icu(CAT_IC[s.c])+'"></i><span class="add">'+(isSel(id)?'✓':'+')+'</span></div><b>'+s.n.replace('استشوار شعر - Beautfresh Signature','استشوار سيغنتشر')+'</b><small class="num">'+(s.v?'من ':'')+sar(s.p)+'</small></button>'}).join('')+'</div>':'')+
  '<div id="list">'+list()+'</div></div>';
}
/* variants sheet */
function sheet(s){
  const sh=$('#sheet');let pick=null;
  const cur=S.sel.find(x=>x.id===s.id);
  const byLen=s.v.some(x=>lenOf(x.n));
  sh.innerHTML='<div class="grab"></div><h2>'+s.n+'</h2><p>'+(s.x||(byLen?'السعر حسب طول الشعر. اختاري الأقرب لطولك، والمختصة تأكد معك في الصالون.':'اختاري اللي يناسبك.'))+'</p>'+
    s.v.map((v,i)=>{const L=lenOf(v.n);return '<button class="opt" data-v="'+i+'">'+(L?'<span class="len" style="--h:'+L[1]+'px"></span>':'<span class="len nol"></span>')+'<span><b>'+(L?L[0]:v.n)+'</b><small>'+dur(v.d)+'</small></span><span class="pr num">'+sar(v.p)+'</span></button>'}).join('')+
    '<button class="primary" id="vok" disabled>'+(byLen?'اختاري الطول':'اختاري واحد')+'</button>';
  const ok=sh.querySelector('#vok');
  sh.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sh.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick=s.v[+b.dataset.v];ok.disabled=false;ok.textContent='أضيفيها · '+sar(pick.p)});
  ok.onclick=()=>{toggle(s,pick);close();render(true)};
  $('#veil').classList.add('show');sh.classList.add('show');
}
function close(){$('#veil').classList.remove('show');$('#sheet').classList.remove('show')}
$('#veil').onclick=close;

/* step 1 time */
const now=new Date();
function dayInfo(i){const d=new Date(now);d.setDate(d.getDate()+i);return d}
const WD=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
function slotsFor(i){
  const seed=(i*7+S.staff*3)%11;const out={'الصباح':[],'العصر':[],'المساء':[]};
  for(let h=10;h<22;h++)for(const m of [0,30]){
    if(i===0&&h<=now.getHours()+1)continue;
    const busy=((h*2+m/30+seed)%5===0)||((h+seed)%7===0);
    const k=h<13?'الصباح':h<17?'العصر':'المساء';
    const t=(h>12?h-12:h)+':'+(m?'30':'00');
    out[k].push({t:A(t),busy,h,m,ap:h<12?'ص':'م'});
  }
  return out;
}
function full(i){return (i+3)%6===0}
function firstFree(){for(let i=0;i<14;i++){if(full(i))continue;const o=slotsFor(i);for(const k in o)for(const x of o[k])if(!x.busy)return {i,x}}}
function dayLabel(i){return i===0?'اليوم':i===1?'بكرة':WD[dayInfo(i).getDay()]+' '+A(dayInfo(i).getDate())}
function s1(){
  const f=firstFree();const sl=slotsFor(S.day);
  return '<div class="screen'+(S.dir?' back':'')+'"><button class="backb" data-back>→ الخدمات</button><h1>متى يناسبك؟</h1>'+
  '<div class="picked">'+S.sel.map(x=>'<span>'+x.n+'</span>').join('')+'</div>'+
  '<button class="soon" id="soon"><span><small>أقرب موعد متاح</small><b>'+dayLabel(f.i)+' · '+f.x.t+' '+f.x.ap+'</b></span><span class="pick">احجزيه</span></button>'+
  '<div class="lbl">مع مين؟</div><div class="staff">'+STAFF.map((s,i)=>'<button class="st'+(S.staff===i?' on':'')+'" data-st="'+i+'"><span class="av'+(i?'':' any')+'">'+(i?s[1]:'<i></i>')+'</span>'+s[0]+'</button>').join('')+'</div>'+
  '<div class="lbl">أو اختاري يوم</div><div class="days">'+Array.from({length:14},(_,i)=>{const d=dayInfo(i);return '<button class="day'+(full(i)?' full':'')+(S.day===i?' on':'')+'" data-d="'+i+'"'+(full(i)?' disabled':'')+'><small>'+(i===0?'اليوم':i===1?'بكرة':WD[d.getDay()])+'</small><b class="num">'+A(d.getDate())+'</b><i></i></button>'}).join('')+'</div>'+
  Object.entries(sl).filter(([,v])=>v.length).map(([k,v])=>'<div class="part">'+k+'</div><div class="slots">'+v.map(x=>{const id=S.day+'-'+x.h+'-'+x.m;return '<button class="slot num'+(S.slot&&S.slot.id===id?' on':'')+'" data-sl="'+id+'" data-t="'+x.t+' '+x.ap+'"'+(x.busy?' disabled':'')+'>'+x.t+'</button>'}).join('')+'</div>').join('')+
  '</div>';
}
/* step 2 details */
function s2(){
  return '<div class="screen'+(S.dir?' back':'')+'"><button class="backb" data-back>→ الوقت</button><h1>آخر خطوة</h1><p class="sub">نحتاج اسمك وجوالك عشان نأكد لك على الواتساب.</p>'+
  '<div class="card">'+S.sel.map(x=>'<div class="sumrow"><span>'+x.n+'</span><span class="num">'+sar(x.p)+'</span></div>').join('')+
  '<div class="sumrow"><span>الموعد</span><span>'+dayLabel(S.slot.day)+' · '+S.slot.t+'</span></div><div class="sumrow"><span>المختصة</span><span>'+STAFF[S.staff][0]+'</span></div>'+
  '<div class="sumrow sumtot"><span>الإجمالي</span><span class="num">'+sar(total())+'</span></div></div>'+
  '<div class="fld"><label for="nm">الاسم</label><input id="nm" autocomplete="given-name" placeholder="اسمك الأول" value="'+S.name+'"></div>'+
  '<div class="fld"><label for="ph">الجوال</label><div class="tel"><span>+966</span><input id="ph" inputmode="tel" autocomplete="tel-national" placeholder="5X XXX XXXX" value="'+S.phone+'"></div></div>'+
  '<div class="lbl">الدفع</div><div class="pay">'+
  '<button class="pm on" type="button"><span class="rd"></span><span><b>الدفع في الصالون</b><small>كاش أو شبكة بعد الخدمة</small></span></button>'+
  '<button class="pm" type="button" disabled><span class="rd"></span><span><b>ادفعي أونلاين</b><small>عربون يثبّت موعدك</small><span class="brands"><span>Apple Pay</span><span>mada</span><span>VISA</span></span></span><span class="soonb">قريبًا</span></button></div>'+
  '<p class="note">تقدرين تعدلين موعدك أو تلغينه من رسالة الواتساب.</p></div>';
}
/* step 3 done */
function s3(){
  const c=['#C9A46A','#5A2A22','#E8DFD1','#9B6B5E'];
  const conf=Array.from({length:18},(_,i)=>{const a=i/18*6.28,r=70+((i*37)%50);return '<i class="conf" style="background:'+c[i%4]+';--x:'+Math.round(Math.cos(a)*r)+'px;--y:'+Math.round(Math.sin(a)*r)+'px;animation-delay:'+(0.5+i%5*0.03)+'s"></i>'}).join('');
  const nm=S.name.trim()||'نورة';
  return '<div class="screen"><div class="done"><div class="seal"><span class="rs"></span>'+conf+'<span class="ck"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F3EBDF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span></div>'+
  '<h1>تم، يا '+nm+'</h1><div class="when">'+dayLabel(S.slot.day)+' · '+S.slot.t+'</div>'+
  '<div class="card ticket">'+S.sel.map(x=>'<div class="sumrow"><span>'+x.n+'</span><span class="num">'+sar(x.p)+'</span></div>').join('')+
  '<div class="sumrow sumtot"><span>الإجمالي</span><span class="num">'+sar(total())+'</span></div><div class="sumrow"><span>المكان</span><span>بيوتفريش · الأحساء</span></div></div>'+
  '<div class="acts"><button class="ghost">＋ أضيفيه للتقويم</button><button class="ghost">⌖ الموقع</button></div>'+
  '<div class="wa"><div class="hd"><i></i>بيوتفريش · واتساب</div><div class="bub">أهلًا '+nm+' ✨ موعدك في بيوتفريش '+dayLabel(S.slot.day)+' الساعة '+S.slot.t+'. نذكّرك قبلها بيوم، ولو تبين تعدلين ردّي على هالرسالة.<time>الآن</time></div></div>'+
  '<div class="stamp"><span><b>بطاقة الولاء</b><br><small style="color:var(--mute)">هالزيارة تضيف لك ختم</small></span><span class="stamps"><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i></span></div>'+
  '<button class="primary" id="again2" style="margin-top:14px">احجزي موعد ثاني</button></div></div>';
}
function render(keepScroll){
  steps();
  main.innerHTML=[s0,s1,s2,s3][S.step]();
  bar();
  bind();
}
function bind(){
  main.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go(S.step-1));
  if(S.step===0){
    const q=$('#q');q.oninput=()=>{S.q=q.value;$('#list').innerHTML=list();bindList();const p=main.querySelector('.pop');if(p)p.style.display=S.q?'none':''};
    main.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.g=+b.dataset.g;render()});
    const ag=$('#again');if(ag)ag.onclick=()=>{const s=byId('astshwar-shar-beautfresh-signature');S.sel=[];toggle(s,s.v[2]);go(1)};
    bindList();
  }
  if(S.step===1){
    $('#soon').onclick=()=>{const f=firstFree();S.day=f.i;S.slot={id:f.i+'-'+f.x.h+'-'+f.x.m,t:f.x.t+' '+f.x.ap,day:f.i};go(2)};
    main.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.staff=+b.dataset.st;S.slot=null;render()});
    main.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.day=+b.dataset.d;S.slot=null;render()});
    main.querySelectorAll('[data-sl]').forEach(b=>b.onclick=()=>{S.slot={id:b.dataset.sl,t:b.dataset.t,day:S.day};main.querySelectorAll('.slot').forEach(x=>x.classList.toggle('on',x===b));bar(true)});
  }
  if(S.step===2){
    const nm=$('#nm'),ph=$('#ph');
    nm.oninput=()=>{S.name=nm.value;bar()};
    ph.oninput=()=>{let d=ph.value.replace(/\D/g,'').replace(/^0/,'').slice(0,9);ph.value=d.replace(/^(\d{2})(\d{0,3})(\d{0,4}).*/,(m,a,b,c)=>[a,b,c].filter(Boolean).join(' '));S.phone=d;bar()};
  }
  if(S.step===3){$('#again2').onclick=()=>{S.sel=[];S.slot=null;go(0)}}
}
function bindList(){
  main.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    const s=byId(b.dataset.s);
    if(s.v&&!isSel(s.id))return sheet(s);
    toggle(s);
    const sel=isSel(s.id);
    main.querySelectorAll('[data-s="'+s.id+'"]').forEach(x=>{x.classList.toggle('sel',sel);const a=x.querySelector('.add');if(a)a.textContent=sel?'✓':'+'});
  });
}
$('#barGo').onclick=()=>{if(S.step===0)go(1);else if(S.step===1&&S.slot)go(2);else if(S.step===2)go(3)};
render();
window.BF={S,go,render,toggle,byId,sheet,firstFree};
</script>
</body>
</html>
