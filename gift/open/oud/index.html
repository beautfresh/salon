<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>وصلتك هدية من بيوتفريش 🎁</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2E1612">
<meta property="og:type" content="website">
<meta property="og:title" content="وصلتك هدية من بيوتفريش 🎁">
<meta property="og:description" content="أحد يحبك أهداك بطاقة من بيوتفريش. افتحيها وشوفي وش فيها 🤍">
<meta property="og:image" content="https://beautfresh.com/gift/og-oud.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../../../home/assets/gift-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../card.css?v=2">
<style>
:root{--oud:#5A2A22;--on:#F3EBDF;--on2:#D9C6B7;--gold:#C9A46A;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(900px 600px at 50% -10%,#6A3229 0%,#2E1612 60%,#1E0E0B 100%);color:var(--on);font-family:Tajawal,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:url(../../../home/assets/rosette-2.svg) 0 0/34px 34px;opacity:.05;filter:brightness(0) invert(1);pointer-events:none}
button,a{font:inherit;color:inherit;text-decoration:none;cursor:pointer}
.wrap{position:relative;max-width:440px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh}
.brand{height:34px;filter:brightness(0) invert(94%) sepia(9%) saturate(380%) hue-rotate(335deg);opacity:.9}
/* الظرف */
.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;transition:opacity .5s,transform .6s var(--ease)}
.intro h1{margin:0;font-size:26px;font-weight:700}.intro p{margin:0;color:var(--on2);font-size:15px}
.env{position:relative;width:min(300px,78vw);aspect-ratio:1.45;margin:24px 0 16px;cursor:pointer;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-4px)}}
.env .bk,.env .fr,.env .fl{position:absolute;left:0;right:0}
.env .bk{inset:0;border-radius:18px;background:linear-gradient(160deg,#E9D9C4,#CDB89D)}
.env .fr{bottom:0;height:100%;clip-path:polygon(0 30%,50% 72%,100% 30%,100% 100%,0 100%);background:linear-gradient(160deg,#F3E7D6,#D9C6AE);border-radius:0 0 18px 18px;z-index:3}
.env .fl{top:0;height:62%;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#E3D1B8,#CDB89D);transform-origin:top;transition:transform .7s var(--ease);z-index:4}
.env .seal{position:absolute;left:50%;top:44%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7A3A2F,#4A231C);display:grid;place-items:center;z-index:5;box-shadow:0 6px 14px -4px rgba(0,0,0,.5);transition:transform .5s var(--ease),opacity .4s}
.env .seal img{width:38px}
.tap{font-size:13.5px;color:var(--on2);animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.45}}
.opening .env{animation:none}
.opening .env .seal{transform:scale(1.4);opacity:0}
.opening .env .fl{transform:rotateX(180deg)}
.gone{opacity:0;transform:translateY(40px) scale(.9);pointer-events:none}
/* البطاقة */
.reveal{display:none;width:100%;flex-direction:column;align-items:center}
.reveal.show{display:flex}
.cardW{width:min(330px,82vw);margin-top:16px;animation:rise 1s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(120px) scale(.7) rotate(-6deg)}}
.hello{margin:16px 0 0;text-align:center;font-size:15px;color:var(--on2);animation:fadeup .8s .6s both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
.flipb{margin-top:10px;border:1px solid rgba(243,235,223,.25);background:rgba(243,235,223,.06);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--on2);animation:fadeup .8s .8s both}
.acts{width:100%;display:grid;gap:10px;margin-top:20px;animation:fadeup .8s 1s both}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:999px;background:var(--on);color:#3F1D17;font-weight:700;font-size:17px;box-shadow:0 18px 30px -16px rgba(0,0,0,.6);transition:transform .2s;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3s 2s infinite}
@keyframes sweep{30%,100%{transform:translateX(120%)}}
.cta:active{transform:scale(.98)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:999px;border:1px solid rgba(243,235,223,.28);background:rgba(243,235,223,.06);font-size:14.5px;font-weight:500;transition:background .2s}
.sec:hover{background:rgba(243,235,223,.12)}
.note{margin-top:14px;text-align:center;font-size:12.5px;color:var(--on2);opacity:.8;line-height:1.7}
.badge{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:999px;font-size:13px;font-weight:700}
.badge.used{background:rgba(243,235,223,.15)}.badge.expired{background:#B3261E;color:#fff}
.conf{position:fixed;top:40%;left:50%;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:20;animation:conf 1.6s var(--ease) forwards;animation-delay:var(--dl)}
@keyframes conf{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(720deg)}}
.err{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--on);color:#3F1D17;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:all .3s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
#exp{position:fixed;left:-9999px;top:0;width:600px}
#exp .bfc{width:600px}#exp .bfc-in{transform:none!important}#exp .bfc-b{display:none}#exp .bfc-f{position:relative;inset:auto;height:960px;box-shadow:none}#exp .bfc-shine,#exp .bfc-glow{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><img class="brand" src="../../../home/assets/Beautfresh-brown.svg" alt="بيوتفريش">
  <div class="err" id="load"><p style="color:var(--on2)">نجهّز هديتك…</p></div>
</div>
<div id="exp" aria-hidden="true"></div>
<div class="toast" id="toast"></div>
<script src="../../../vendor/qrcode.js"></script>
<script src="../../../assets/config.js"></script>
<script src="../../card.js?v=2"></script>
<script>
(async () => {
  const { html, interact, fmt, esc, dateAr } = window.BFCard;
  const CFG = window.APP_CONFIG, $ = (s) => document.querySelector(s);
  const app = $('#app'), token = new URLSearchParams(location.search).get('t') || '';
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };
  let g = null;
  try {
    if (!/^[0-9a-f-]{36}$/i.test(token)) throw 0;
    const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/gift_open`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseKey }, body: JSON.stringify({ p_token: token }) });
    g = await r.json(); if (!r.ok || !g) throw 0;
  } catch {
    $('#load').innerHTML = `<h2 style="margin:0">ما لقينا هالبطاقة</h2><p style="color:var(--on2);margin:0">تأكدي من الرابط، أو كلمينا على الواتساب ونرسله لك من جديد.</p><a class="sec" style="padding:0 22px;margin-top:10px" href="https://wa.me/966509492224">واتساب بيوتفريش</a>`;
    return;
  }
  const first = (g.to || '').trim().split(/\s+/)[0];
  $('#load').remove();
  app.insertAdjacentHTML('beforeend', `
    <div class="intro" id="intro"><h1>${esc(first)}، وصلتك هدية 🤍</h1><p>${g.from ? `من ${esc(g.from)}` : 'من شخص يحبك'}</p>
      <div class="env" id="env" role="button" aria-label="افتحي الهدية"><div class="bk"></div><div class="fl"></div><div class="fr"></div><div class="seal"><img src="../../../home/assets/gift-mark-cream.svg" alt=""></div></div>
      <span class="tap">اضغطي على الظرف عشان تفتحينه</span></div>
    <div class="reveal" id="rev">
      <div class="cardW" id="cardW">${html(g)}</div>
      ${g.status !== 'active' ? `<span class="badge ${g.status}">${g.status === 'used' ? 'هالبطاقة استُخدمت كاملة' : 'هالبطاقة انتهت صلاحيتها'}</span>` : ''}
      <button class="flipb" id="flip">↻ اقلبي البطاقة</button>
      <div class="acts">
        ${g.status === 'active' ? `<a class="cta" href="../../../book/?gift=${encodeURIComponent(token)}">احجزي بهديتك ←</a>` : ''}
        <div class="row"><button class="sec" id="save">⤓ احفظيها صورة</button><button class="sec" id="share">↗ شاركيها</button></div>
      </div>
      <p class="note">رصيدك ${fmt(g.balance)} ريال${g.expires ? ` · صالحة لين ${dateAr(g.expires)}` : ''}<br>أظهري الكود <b dir="ltr">${esc(g.code)}</b> في الصالون</p>
    </div>`);
  const flipFn = interact($('#cardW'));
  $('#flip').onclick = () => flipFn();
  $('#cardW').onclick = (e) => { if (!e.target.closest('a,button')) flipFn(); };
  const open = () => {
    const intro = $('#intro'); if (intro.classList.contains('opening')) return;
    intro.classList.add('opening');
    setTimeout(() => {
      intro.classList.add('gone');
      const cols = ['#C9A46A', '#F3EBDF', '#C99286', '#E3C690'];
      for (let i = 0; i < 40; i++) { const c = document.createElement('i'); c.className = 'conf'; const a = (i / 40) * 6.283, r = 120 + (i * 37) % 120; c.style.cssText = `background:${cols[i % 4]};--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r - 60}px;--dl:${(i % 6) * .03}s`; document.body.appendChild(c); setTimeout(() => c.remove(), 2200); }
      setTimeout(() => { intro.remove(); $('#rev').classList.add('show'); navigator.vibrate?.(30); setTimeout(() => prepare().catch(() => {}), 1800); }, 380);
    }, 650);
  };
  $('#env').onclick = open;
  addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(); });

  // حفظ صورة
  let h2i = null;
  const lib = () => h2i || (h2i = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js'; s.onload = () => res(window.htmlToImage); s.onerror = rej; document.head.appendChild(s); }));
  // الخطوط مضمّنة في الصورة (عشان تطلع نفس البطاقة بالضبط)
  const fontCSS = async () => {
    const href = [...document.querySelectorAll('link[rel=stylesheet]')].map((l) => l.href).find((h) => h.includes('fonts.googleapis'));
    const css = await (await fetch(href)).text();
    const blocks = css.split('/*').filter((b) => /^\s*(arabic|latin)\s*\*\//.test(b)).map((b) => b.replace(/^[^*]*\*\//, ''));
    let out = blocks.join('\n');
    const urls = [...new Set([...out.matchAll(/url\((https:[^)]+)\)/g)].map((m) => m[1]))];
    await Promise.all(urls.map(async (u) => { const bl = await (await fetch(u)).blob(); const d = await new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(bl); }); out = out.split(u).join(d); }));
    return out;
  };
  let ready = null, readyUrl = null;
  const png = async () => { const H = await lib(); const fcss = await fontCSS().catch(() => undefined); const box = $('#exp'); box.innerHTML = html(g); await document.fonts.ready; const node = box.querySelector('.bfc-f'); const url = await H.toPng(node, { pixelRatio: 2, cacheBust: true, fontEmbedCSS: fcss }); box.innerHTML = ''; return url; };
  const prepare = () => ready || (ready = png().then(async (url) => { readyUrl = url; const bl = await (await fetch(url)).blob(); return new File([bl], 'هدية-بيوتفريش.png', { type: 'image/png' }); }).catch((e) => { ready = null; throw e; }));
  const download = (url) => { const a = document.createElement('a'); a.href = url; a.download = 'هدية-بيوتفريش.png'; document.body.appendChild(a); a.click(); a.remove(); toast('انحفظت الصورة 🤍'); };
  $('#save').onclick = async (e) => {
    const b = e.currentTarget;
    // إذا الصورة جاهزة نشاركها فورًا (المتصفح يطلب إنها تصير مع الضغطة)
    if (readyUrl) { try { const file = await ready; if (navigator.canShare?.({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) await navigator.share({ files: [file], title: 'هديتي من بيوتفريش' }); else download(readyUrl); } catch (err) { if (err?.name !== 'AbortError') download(readyUrl); } return; }
    b.disabled = true; b.textContent = 'نجهّزها…';
    try { await prepare(); download(readyUrl); } catch { toast('ما قدرنا نحفظها، جربي مرة ثانية'); }
    b.disabled = false; b.textContent = '⤓ احفظيها صورة';
  };
  $('#share').onclick = async () => {
    const data = { title: 'هديتي من بيوتفريش 🎁', text: `وصلتني هدية من بيوتفريش 🤍`, url: 'https://beautfresh.com/gift/' };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); toast('انسخ الرابط'); } } catch {}
  };
})();
</script>
</body>
</html>
